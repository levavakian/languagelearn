services:
  - type: web
    name: languagelearn
    env: docker
    dockerfilePath: ./Dockerfile.deploy
    disk:
      name: dbdata
      mountPath: /var/dbdata
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /var/dbdata/
      - key: OPENAI_SECRET_KEY
        sync: false
      - key: GOOGLE_API_SECRET
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: SQUARE_APP_ID
        sync: false
      - key: SQUARE_LOCATION_ID
        sync: false
      - key: SQUARE_ACCESS_TOKEN
        sync: false
